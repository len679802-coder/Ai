<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Secure Script Vault</title>

<link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
>


<style>

*{
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:#24163d;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(124,58,237,.18),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(167,139,250,.22),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #fff,
            #f5f0ff
        );

}


.container{

    width:560px;

    max-width:100%;

    padding:42px;

    border-radius:28px;

    background:rgba(255,255,255,.92);

    backdrop-filter:blur(20px);

    border:1px solid
        rgba(124,58,237,.12);

    box-shadow:

        0 30px 80px
        rgba(91,33,182,.15);

}


.header{

    text-align:center;

    margin-bottom:30px;

}


.icon-box{

    width:74px;

    height:74px;

    margin:0 auto 18px;

    border-radius:23px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    background:

        linear-gradient(
            135deg,
            #a78bfa,
            #7c3aed,
            #5b21b6
        );

    box-shadow:

        0 14px 35px
        rgba(124,58,237,.3);

}


.icon-box i{

    font-size:32px;

}


h2{

    margin:0;

    font-size:27px;

    font-weight:800;

    background:

        linear-gradient(
            90deg,
            #4c1d95,
            #7c3aed,
            #9333ea
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

}


.subtitle{

    margin:8px 0 0;

    font-size:13px;

    line-height:1.6;

    color:#817795;

}


.group{

    margin-bottom:22px;

}


label{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:9px;

    color:#4b3b63;

    font-size:13px;

    font-weight:700;

}


label i{

    color:#7c3aed;

}


textarea,
input{

    width:100%;

    border:1px solid #e9e2f7;

    border-radius:15px;

    background:#fcfaff;

    color:#332047;

    outline:none;

}


textarea{

    height:150px;

    padding:16px;

    resize:vertical;

    font-size:14px;

}


textarea:focus,
input:focus{

    border-color:#8b5cf6;

    box-shadow:

        0 0 0 4px
        rgba(124,58,237,.1);

}


.btn-primary{

    width:100%;

    padding:17px;

    border:0;

    border-radius:15px;

    cursor:pointer;

    color:white;

    font-size:15px;

    font-weight:700;

    background:

        linear-gradient(
            135deg,
            #a78bfa,
            #7c3aed,
            #6d28d9
        );

    box-shadow:

        0 10px 25px
        rgba(124,58,237,.25);

}


.btn-primary:disabled{

    opacity:.6;

    cursor:not-allowed;

}


#output-section{

    margin-top:30px;

    padding-top:27px;

    border-top:
        1px solid #eee8f7;

    display:none;

}


.result{

    position:relative;

}


input{

    height:48px;

    padding:
        12px
        50px
        12px
        14px;

    font-family:monospace;

    font-size:12px;

    color:#6d28d9;

}


.result textarea{

    height:125px;

    padding:
        14px
        50px
        14px
        14px;

    font-family:monospace;

    font-size:12px;

    color:#5b21b6;

    line-height:1.6;

    resize:none;

}


.copy-btn{

    position:absolute;

    right:9px;

    top:50%;

    transform:
        translateY(-50%);

    width:35px;

    height:35px;

    border:0;

    border-radius:10px;

    background:#eee8ff;

    color:#7c3aed;

    cursor:pointer;

}


.status{

    margin-top:14px;

    padding:12px;

    border-radius:12px;

    font-size:13px;

    display:none;

}


.ok{

    background:#ecfdf5;

    color:#047857;

}


.err{

    background:#fef2f2;

    color:#b91c1c;

}


@media(max-width:600px){

    .container{

        padding:
            28px 21px;

        border-radius:23px;

    }

    h2{

        font-size:23px;

    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="icon-box">

            <i class="fa-solid fa-shield-cat"></i>

        </div>


        <h2>
            Secure Script Vault
        </h2>


        <p class="subtitle">

            ระบบจัดการ Lua Script<br>

            เชื่อมต่อ Node.js Backend โดยตรง

        </p>

    </div>



    <div class="group">

        <label>

            <i class="fa-solid fa-code"></i>

            วางโค้ด Lua ของคุณ

        </label>


        <textarea
            id="luaScript"
            placeholder="print('Hello Roblox Security!')"
        ></textarea>

    </div>



    <button
        id="generateBtn"
        class="btn-primary"
        onclick="autoGenerate()"
    >

        <i class="fa-solid fa-wand-magic-sparkles"></i>

        สร้างลิงก์

    </button>



    <div
        id="status"
        class="status"
    ></div>



    <div id="output-section">


        <div class="group">

            <label>

                <i class="fa-solid fa-link"></i>

                ลิงก์สำหรับดึงสคริปต์

            </label>


            <div class="result">

                <input
                    id="generatedUrl"
                    readonly
                >


                <button
                    class="copy-btn"
                    onclick="copyText('generatedUrl',this)"
                >

                    <i
                        class="fa-regular fa-copy"
                    ></i>

                </button>

            </div>

        </div>



        <div class="group">

            <label>

                <i class="fa-solid fa-terminal"></i>

                ข้อมูลจาก Backend

            </label>


            <div class="result">

                <textarea
                    id="robloxLoader"
                    readonly
                ></textarea>


                <button
                    class="copy-btn"
                    style="top:28px"
                    onclick="copyText('robloxLoader',this)"
                >

                    <i
                        class="fa-regular fa-copy"
                    ></i>

                </button>

            </div>

        </div>


    </div>


</div>



<script>


function showStatus(
    message,
    success = false
){

    const box =
        document.getElementById(
            "status"
        );


    box.textContent =
        message;


    box.className =
        "status " +
        (
            success
            ? "ok"
            : "err"
        );


    box.style.display =
        "block";

}



async function autoGenerate(){

    const script =
        document
        .getElementById(
            "luaScript"
        )
        .value
        .trim();


    const button =
        document.getElementById(
            "generateBtn"
        );


    if(!script){

        showStatus(
            "กรุณาใส่โค้ด Lua ก่อน"
        );

        return;

    }


    button.disabled =
        true;


    button.innerHTML =

        '<i class="fa-solid fa-spinner fa-spin"></i> ' +
        'กำลังสร้าง...';


    try{


        /*
         * ส่ง Lua ไปยัง Node.js
         */

        const response =
            await fetch(
                "/api/save-script",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            scriptContent:
                                script
                        })

                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Backend error"
            );

        }


        /*
         * สร้าง URL จริง
         */

        const url =
            new URL(
                "/api/get-script/" +
                encodeURIComponent(
                    data.scriptId
                ),

                window.location.origin

            ).href;


        document
            .getElementById(
                "generatedUrl"
            )
            .value =
                url;



        /*
         * แสดงข้อมูลสำหรับตรวจสอบ
         */

        document
            .getElementById(
                "robloxLoader"
            )
            .value =

`Script ID:
${data.scriptId}

API URL:
${url}`;



        document
            .getElementById(
                "output-section"
            )
            .style.display =
                "block";


        showStatus(

            "สร้างลิงก์สำเร็จ • " +
            data.scriptId,

            true

        );


    }

    catch(error){

        console.error(error);


        showStatus(

            "เชื่อมต่อ Backend ไม่สำเร็จ: " +
            error.message

        );

    }


    finally{

        button.disabled =
            false;


        button.innerHTML =

            '<i class="fa-solid fa-wand-magic-sparkles"></i> ' +
            'สร้างลิงก์';

    }

}



async function copyText(
    id,
    button
){

    const element =
        document.getElementById(
            id
        );


    try{

        await navigator
            .clipboard
            .writeText(
                element.value
            );


        button.innerHTML =

            '<i class="fa-solid fa-check"></i>';


        setTimeout(

            () => {

                button.innerHTML =

                    '<i class="fa-regular fa-copy"></i>';

            },

            1500

        );

    }

    catch(error){

        showStatus(
            "คัดลอกไม่สำเร็จ"
        );

    }

}

</script>


</body>

</html>
