<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Script Vault</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

:root{
    --purple:#7c3aed;
    --purple2:#8b5cf6;
    --purple3:#a78bfa;
    --dark:#4c1d95;
    --text:#24163d;
    --muted:#817795;
    --border:#e9e2f7;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 10%,rgba(124,58,237,.18),transparent 35%),
        radial-gradient(circle at 90% 90%,rgba(167,139,250,.22),transparent 35%),
        linear-gradient(135deg,#fff,#f5f0ff);
}

body:before{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    background:rgba(124,58,237,.08);
    filter:blur(90px);
    top:-180px;
    right:-120px;
    pointer-events:none;
}

body:after{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(167,139,250,.12);
    filter:blur(90px);
    bottom:-150px;
    left:-120px;
    pointer-events:none;
}

.container{
    position:relative;
    z-index:2;
    width:560px;
    max-width:100%;
    padding:42px;
    border-radius:28px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(124,58,237,.12);
    box-shadow:
        0 30px 80px rgba(91,33,182,.15),
        0 8px 30px rgba(36,22,61,.06);
    animation:containerIn .6s ease;
}

@keyframes containerIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.header{
    text-align:center;
    margin-bottom:34px;
}

.icon-box{
    width:74px;
    height:74px;
    margin:0 auto 18px;
    border-radius:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:linear-gradient(135deg,#a78bfa,#7c3aed,#5b21b6);
    box-shadow:
        0 14px 35px rgba(124,58,237,.3),
        inset 0 1px 0 rgba(255,255,255,.4);
    animation:floatIcon 3s ease-in-out infinite;
}

.icon-box i{
    font-size:32px;
}

@keyframes floatIcon{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
}

h2{
    margin:0;
    font-size:27px;
    font-weight:800;
    letter-spacing:-1px;
    background:linear-gradient(90deg,#4c1d95,#7c3aed,#9333ea);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    margin:8px 0 0;
    font-size:13px;
    line-height:1.6;
    color:var(--muted);
}

.group{
    margin-bottom:22px;
}

label{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:9px;
    color:#4b3b63;
    font-size:13px;
    font-weight:700;
}

label i{
    color:var(--purple);
}

textarea,
input.box-result{
    width:100%;
    background:#fcfaff;
    border:1px solid var(--border);
    border-radius:15px;
    color:#332047;
    transition:.25s ease;
    box-shadow:inset 0 1px 3px rgba(91,33,182,.04);
}

textarea{
    height:150px;
    padding:16px;
    resize:vertical;
    font-size:14px;
    outline:none;
}

textarea::placeholder{
    color:#b4a9c5;
}

textarea:focus,
input.box-result:focus{
    outline:none;
    border-color:#8b5cf6;
    background:#fff;
    box-shadow:
        0 0 0 4px rgba(124,58,237,.10),
        0 8px 25px rgba(124,58,237,.07);
}

.btn-primary{
    width:100%;
    padding:17px;
    border:0;
    border-radius:15px;
    cursor:pointer;
    color:#fff;
    font-size:15px;
    font-weight:700;
    background:linear-gradient(135deg,#a78bfa,#7c3aed,#6d28d9);
    box-shadow:0 10px 25px rgba(124,58,237,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:.25s ease;
}

.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(124,58,237,.35);
}

.btn-primary:active{
    transform:translateY(0);
}

#output-section{
    margin-top:30px;
    padding-top:27px;
    border-top:1px solid #eee8f7;
    display:none;
    animation:slideUp .45s ease;
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.result-box-wrapper{
    position:relative;
}

input.box-result{
    height:48px;
    padding:12px 50px 12px 14px;
    font-family:'Courier New',monospace;
    font-size:12px;
    color:#6d28d9;
}

textarea.box-result{
    width:100%;
    height:120px;
    padding:14px 50px 14px 14px;
    resize:none;
    background:#faf7ff;
    border:1px solid var(--border);
    border-radius:15px;
    color:#5b21b6;
    font-family:'Courier New',monospace;
    font-size:12px;
    line-height:1.6;
    outline:none;
}

.copy-btn{
    position:absolute;
    right:9px;
    top:50%;
    transform:translateY(-50%);
    width:35px;
    height:35px;
    border:0;
    border-radius:10px;
    background:#eee8ff;
    color:#7c3aed;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s ease;
}

.copy-btn:hover{
    background:#ddd1ff;
    color:#5b21b6;
    transform:translateY(-50%) scale(1.05);
}

.copy-btn.copied{
    background:#dcfce7;
    color:#16a34a;
}

@media(max-width:600px){
    body{
        padding:14px;
    }

    .container{
        padding:28px 21px;
        border-radius:23px;
    }

    h2{
        font-size:23px;
    }

    .icon-box{
        width:64px;
        height:64px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="icon-box">
            <i class="fa-solid fa-shield-cat"></i>
        </div>

        <h2>Secure Script Vault</h2>

        <p class="subtitle">
            ระบบจัดการและป้องกัน Lua Script<br>
            พร้อมระบบสร้างลิงก์สำหรับเรียกใช้งาน
        </p>

    </div>

    <div class="group">

        <label>
            <i class="fa-solid fa-code"></i>
            วางโค้ด Lua ของคุณที่นี่
        </label>

        <textarea
            id="luaScript"
            placeholder="print('Hello Roblox Security!')"
        ></textarea>

    </div>

    <button class="btn-primary" onclick="autoGenerate()">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        สร้างลิงก์และเข้ารหัสสคริปต์
    </button>

    <div id="output-section">

        <div class="group">

            <label>
                <i class="fa-solid fa-link"></i>
                ลิงก์สำหรับดึงสคริปต์
            </label>

            <div class="result-box-wrapper">

                <input
                    type="text"
                    readonly
                    class="box-result"
                    id="generatedUrl"
                >

                <button
                    class="copy-btn"
                    onclick="copyText('generatedUrl',event)"
                >
                    <i class="fa-regular fa-copy"></i>
                </button>

            </div>

        </div>

        <div class="group">

            <label>
                <i class="fa-solid fa-terminal"></i>
                โค้ด Lua สำหรับนำไปรัน
            </label>

            <div class="result-box-wrapper">

                <textarea
                    readonly
                    class="box-result"
                    id="robloxLoader"
                ></textarea>

                <button
                    class="copy-btn"
                    onclick="copyText('robloxLoader',event)"
                    style="top:25px"
                >
                    <i class="fa-regular fa-copy"></i>
                </button>

            </div>

        </div>

    </div>

</div>

<script>

function autoGenerate(){

    const script =
        document.getElementById("luaScript").value.trim();

    const output =
        document.getElementById("output-section");

    if(!script){
        alert("กรุณาใส่โค้ด Lua ก่อน");
        return;
    }

    const uniqueId =
        "sec_" +
        Math.random()
        .toString(36)
        .substring(2,12);

    const currentDomain =
        window.location.origin +
        window.location.pathname;

    const autoUrl =
        currentDomain +
        "api/get-script/" +
        uniqueId;

    const scriptData = {
        scriptContent:script
    };

    localStorage.setItem(
        uniqueId,
        JSON.stringify(scriptData)
    );

    const robloxCode =
`local HttpService = game:GetService("HttpService")
local targetUrl = "${autoUrl}"

local success, response = pcall(function()
    return HttpService:GetAsync(targetUrl)
end)

if success and response then

    local data = HttpService:JSONDecode(response)

    if data and data.scriptContent then

        local fn, err = loadstring(data.scriptContent)

        if fn then
            pcall(fn)
        else
            warn("Execution Error: " .. tostring(err))
        end

    end

else

    warn("Access Denied: เซิร์ฟเวอร์ปฏิเสธการเข้าถึง")

end`;

    document.getElementById("generatedUrl").value =
        autoUrl;

    document.getElementById("robloxLoader").value =
        robloxCode;

    output.style.display = "block";
}

function copyText(elementId,event){

    const element =
        document.getElementById(elementId);

    navigator.clipboard.writeText(
        element.value
    );

    const button =
        event.currentTarget;

    button.innerHTML =
        '<i class="fa-solid fa-check"></i>';

    button.classList.add("copied");

    setTimeout(function(){

        button.innerHTML =
            '<i class="fa-regular fa-copy"></i>';

        button.classList.remove("copied");

    },1500);
}

</script>

</body>
</html>
