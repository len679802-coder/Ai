<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>RedLua</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(255,0,0,.14),
            transparent 30%
        ),
        #070707;
    color:#eee;
    font-family:
        Inter,
        system-ui,
        sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:235px;
    background:#0c0c0c;
    border-right:1px solid #242424;
    padding:22px;
}

.logo{
    font-size:22px;
    font-weight:900;
    margin-bottom:35px;
}

.logo span{
    color:#ff2929;
}

.logo-box{
    display:inline-grid;
    place-items:center;
    width:40px;
    height:40px;
    margin-right:9px;
    border-radius:11px;
    background:
        linear-gradient(
            135deg,
            #ff3333,
            #850000
        );
}

.nav-title{
    color:#555;
    font-size:10px;
    letter-spacing:1.5px;
    margin:20px 8px 8px;
}

.nav{
    width:100%;
    padding:12px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#777;
    text-align:left;
    cursor:pointer;
    margin-bottom:5px;
}

.nav:hover,
.nav.active{
    background:#241010;
    color:white;
}

.nav.active{
    box-shadow:inset 3px 0 #ff3030;
}

.server{
    position:absolute;
    bottom:20px;
    left:22px;
    right:22px;
    padding:11px;
    border:1px solid #292929;
    background:#111;
    border-radius:10px;
    color:#666;
    font-size:10px;
}

.server b{
    color:#35d98a;
}

.main{
    margin-left:235px;
    padding:30px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.title{
    font-size:30px;
    font-weight:900;
}

.title span{
    color:#ff3030;
}

.sub{
    color:#666;
    font-size:12px;
    margin-top:4px;
}

.header{
    margin-bottom:22px;
}

.editors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.card{
    background:#101010;
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
}

.card-head{
    display:flex;
    justify-content:space-between;
    padding:13px 15px;
    border-bottom:1px solid #292929;
    font-size:11px;
    font-weight:700;
}

.counter{
    color:#555;
}

textarea{
    display:block;
    width:100%;
    height:430px;
    resize:none;
    border:0;
    outline:0;
    background:#080808;
    color:#ddd;
    padding:17px;
    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;
    font-size:13px;
    line-height:1.65;
}

textarea::placeholder{
    color:#3b3b3b;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:15px;
}

.option{
    background:#101010;
    border:1px solid #292929;
    border-radius:13px;
    padding:15px;
}

.option-title{
    color:#aaa;
    font-size:11px;
    font-weight:700;
    margin-bottom:10px;
}

.levels{
    display:flex;
    gap:7px;
}

.level{
    flex:1;
    padding:9px 5px;
    border:1px solid #303030;
    border-radius:8px;
    background:#181818;
    color:#666;
    cursor:pointer;
    font-size:10px;
}

.level.active{
    color:white;
    border-color:#ff3030;
    background:#291010;
}

.checks{
    display:flex;
    flex-wrap:wrap;
    gap:13px;
}

.check{
    color:#888;
    font-size:11px;
}

.check input{
    accent-color:#ff3030;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.btn{
    border:1px solid #303030;
    background:#171717;
    color:#ccc;
    padding:11px 15px;
    border-radius:9px;
    cursor:pointer;
    font-size:11px;
}

.btn:hover{
    border-color:#555;
}

.btn.red{
    color:white;
    border-color:#ff3030;
    background:
        linear-gradient(
            135deg,
            #ff3838,
            #990000
        );
}

.btn.green{
    color:white;
    border-color:#28b875;
    background:#095c38;
}

.url-box{
    display:none;
    margin-top:15px;
    padding:15px;
    background:#160909;
    border:1px solid #482222;
    border-radius:13px;
}

.url-title{
    color:#ff5050;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
}

.url-row{
    display:flex;
    gap:8px;
}

.url{
    flex:1;
    min-width:0;
    background:#080808;
    color:#fff;
    border:1px solid #382020;
    border-radius:8px;
    padding:10px;
    outline:0;
    font-size:11px;
}

.toolbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.search{
    width:230px;
    background:#111;
    border:1px solid #292929;
    color:#fff;
    padding:10px;
    border-radius:9px;
    outline:0;
}

.list{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:13px;
}

.script{
    background:#111;
    border:1px solid #292929;
    border-radius:13px;
    padding:15px;
}

.script-name{
    font-weight:700;
    margin-bottom:7px;
    word-break:break-word;
}

.meta{
    color:#555;
    font-size:10px;
    margin-bottom:12px;
}

.script-actions{
    display:flex;
    gap:6px;
}

.script-actions button{
    flex:1;
    border:1px solid #292929;
    background:#181818;
    color:#aaa;
    padding:8px;
    border-radius:7px;
    cursor:pointer;
    font-size:10px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:50px;
    border:1px dashed #333;
    border-radius:13px;
    color:#444;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    padding:12px 15px;
    background:#181818;
    border:1px solid #393939;
    border-left:3px solid #ff3030;
    border-radius:9px;
    font-size:11px;
    opacity:0;
    transform:translateY(60px);
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

.mobile-menu{
    display:none;
}

@media(max-width:900px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
        z-index:50;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        padding:15px;
    }

    .mobile-menu{
        display:block;
        margin-bottom:15px;
    }

    .mobile-menu button{
        background:#111;
        color:white;
        border:1px solid #292929;
        padding:10px 13px;
        border-radius:8px;
    }

    .editors,
    .options{
        grid-template-columns:1fr;
    }

    .list{
        grid-template-columns:1fr;
    }

    textarea{
        height:330px;
    }

    .url-row{
        flex-direction:column;
    }
}

</style>

</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <span class="logo-box">L</span>
        Red<span>Lua</span>
    </div>

    <div class="nav-title">
        WORKSPACE
    </div>

    <button
        class="nav active"
        id="editorNav"
        onclick="page('editor')"
    >
        ⚡ Obfuscator
    </button>

    <button
        class="nav"
        id="vaultNav"
        onclick="page('vault')"
    >
        ▣ Script Vault
    </button>

    <div class="nav-title">
        TOOLS
    </div>

    <button
        class="nav"
        onclick="clearAll()"
    >
        Clear Editor
    </button>

    <div class="server">
        ● <b>SERVER ONLINE</b>
        <br>
        RedLua Local Server
    </div>

</aside>

<main class="main">

    <div class="mobile-menu">
        <button onclick="menu()">
            ☰ Menu
        </button>
    </div>

    <section
        id="editorPage"
        class="page active"
    >

        <div class="header">

            <div class="title">
                Lua <span>Obfuscator</span>
            </div>

            <div class="sub">
                Minify • Obfuscate • Copy • Generate URL
            </div>

        </div>

        <div class="editors">

            <div class="card">

                <div class="card-head">
                    <span>SOURCE LUA</span>

                    <span
                        class="counter"
                        id="inputCount"
                    >
                        0 chars
                    </span>
                </div>

                <textarea
                    id="input"
                    spellcheck="false"
                    placeholder="วาง Lua Script ของคุณที่นี่..."
                ></textarea>

            </div>

            <div class="card">

                <div class="card-head">
                    <span>OBFUSCATED OUTPUT</span>

                    <span
                        class="counter"
                        id="outputCount"
                    >
                        0 chars
                    </span>
                </div>

                <textarea
                    id="output"
                    readonly
                    spellcheck="false"
                    placeholder="ผลลัพธ์จะปรากฏที่นี่..."
                ></textarea>

            </div>

        </div>

        <div class="options">

            <div class="option">

                <div class="option-title">
                    OBFUSCATION LEVEL
                </div>

                <div class="levels">

                    <button
                        class="level"
                        data-level="1"
                    >
                        LIGHT
                    </button>

                    <button
                        class="level active"
                        data-level="2"
                    >
                        MEDIUM
                    </button>

                    <button
                        class="level"
                        data-level="3"
                    >
                        HARD
                    </button>

                    <button
                        class="level"
                        data-level="4"
                    >
                        EXTREME
                    </button>

                </div>

            </div>

            <div class="option">

                <div class="option-title">
                    PROTECTION
                </div>

                <div class="checks">

                    <label class="check">
                        <input
                            id="comments"
                            type="checkbox"
                            checked
                        >
                        Remove comments
                    </label>

                    <label class="check">
                        <input
                            id="locals"
                            type="checkbox"
                            checked
                        >
                        Rename locals
                    </label>

                    <label class="check">
                        <input
                            id="strings"
                            type="checkbox"
                            checked
                        >
                        Protect strings
                    </label>

                    <label class="check">
                        <input
                            id="minify"
                            type="checkbox"
                            checked
                        >
                        Minify
                    </label>

                </div>

            </div>

        </div>

        <div class="actions">

            <button
                class="btn red"
                onclick="obfuscate()"
            >
                ⚡ Obfuscate
            </button>

            <button
                class="btn red"
                onclick="copyObfuscated()"
            >
                🔒 Copy Minified + Obfuscated
            </button>

            <button
                class="btn green"
                onclick="generateURL()"
            >
                🔗 Generate URL
            </button>

            <button
                class="btn"
                onclick="downloadLua()"
            >
                Download .lua
            </button>

            <button
                class="btn"
                onclick="clearAll()"
            >
                Clear
            </button>

        </div>

        <div
            class="url-box"
            id="urlBox"
        >

            <div class="url-title">
                GENERATED URL
            </div>

            <div class="url-row">

                <input
                    class="url"
                    id="generatedURL"
                    readonly
                >

                <button
                    class="btn red"
                    onclick="copyURL()"
                >
                    Copy URL
                </button>

            </div>

        </div>

    </section>

    <section
        id="vaultPage"
        class="page"
    >

        <div class="header">

            <div class="title">
                Script <span>Vault</span>
            </div>

            <div class="sub">
                Scripts ที่บันทึกไว้บน Server
            </div>

        </div>

        <div class="toolbar">

            <strong>
                Saved Scripts
            </strong>

            <input
                id="search"
                class="search"
                placeholder="ค้นหา Script..."
                oninput="loadVault()"
            >

        </div>

        <div
            class="list"
            id="scriptList"
        ></div>

    </section>

</main>

<div
    class="toast"
    id="toast"
></div>

<script>

const input =
    document.getElementById("input");

const output =
    document.getElementById("output");

let level = 2;

/* Counter */

input.addEventListener(
    "input",
    () => {

        document.getElementById(
            "inputCount"
        ).textContent =
            input.value.length.toLocaleString()
            + " chars";
    }
);

/* Level */

document
.querySelectorAll(".level")
.forEach(button => {

    button.onclick = () => {

        document
        .querySelectorAll(".level")
        .forEach(x =>
            x.classList.remove("active")
        );

        button.classList.add("active");

        level =
            Number(button.dataset.level);
    };
});

/* Toast */

function toast(text){

    const box =
        document.getElementById("toast");

    box.textContent = text;

    box.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {
            box.classList.remove("show");
        }, 2200);
}

/* Menu */

function menu(){

    document
    .getElementById("sidebar")
    .classList.toggle("open");
}

/* Page */

function page(name){

    const editor =
        document.getElementById(
            "editorPage"
        );

    const vault =
        document.getElementById(
            "vaultPage"
        );

    const editorNav =
        document.getElementById(
            "editorNav"
        );

    const vaultNav =
        document.getElementById(
            "vaultNav"
        );

    if(name === "editor"){

        editor.classList.add("active");
        vault.classList.remove("active");

        editorNav.classList.add("active");
        vaultNav.classList.remove("active");

    }else{

        editor.classList.remove("active");
        vault.classList.add("active");

        editorNav.classList.remove("active");
        vaultNav.classList.add("active");

        loadVault();
    }

    document
    .getElementById("sidebar")
    .classList.remove("open");
}

/* Remove Lua comments */

function removeComments(code){

    let result = "";
    let string = false;
    let quote = "";

    for(
        let i = 0;
        i < code.length;
        i++
    ){

        const c = code[i];
        const n = code[i + 1];

        if(
            !string &&
            (c === '"' || c === "'")
        ){

            string = true;
            quote = c;
            result += c;
            continue;
        }

        if(string){

            result += c;

            if(
                c === "\\" &&
                i + 1 < code.length
            ){
                result += code[++i];
                continue;
            }

            if(c === quote){
                string = false;
            }

            continue;
        }

        if(c === "-" && n === "-"){

            while(
                i < code.length &&
                code[i] !== "\n"
            ){
                i++;
            }

            result += "\n";
            continue;
        }

        result += c;
    }

    return result;
}

/* Random name */

function randomName(){

    const chars =
        "abcdefghijklmnopqrstuvwxyz";

    let name = "_";

    const length =
        Math.min(4 + level, 8);

    for(
        let i = 0;
        i < length;
        i++
    ){

        name +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];
    }

    return name;
}

/* Rename local variables */

function renameLocals(code){

    const map = {};

    const regex =
        /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)/g;

    let match;

    while(
        (match = regex.exec(code))
    ){

        const name = match[1];

        if(!map[name]){
            map[name] = randomName();
        }
    }

    for(
        const oldName of Object.keys(map)
    ){

        const escaped =
            oldName.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
            );

        code =
            code.replace(
                new RegExp(
                    "\\b" +
                    escaped +
                    "\\b",
                    "g"
                ),
                map[oldName]
            );
    }

    return code;
}

/* String protection */

function protectStrings(code){

    return code.replace(
        /(["'])(.*?)\1/g,
        (match, quote, value) => {

            let hex = "";

            for(
                let i = 0;
                i < value.length;
                i++
            ){

                hex +=
                    value
                    .charCodeAt(i)
                    .toString(16)
                    .padStart(2,"0");
            }

            return `(function()local h="${hex}"local s=""for i=1,#h,2 do s=s..string.char(tonumber(h:sub(i,i+1),16))end return s end)()`;
        }
    );
}

/* Minify */

function minify(code){

    return code
        .replace(
            /[ \t]+/g,
            " "
        )
        .replace(
            /\n\s*\n/g,
            "\n"
        )
        .replace(
            /\s*([(),{}\[\]])\s*/g,
            "$1"
        )
        .trim();
}

/* Obfuscate */

function obfuscate(){

    let code =
        input.value.trim();

    if(!code){

        toast(
            "กรุณาใส่ Lua Script ก่อน"
        );

        return "";
    }

    if(
        document.getElementById(
            "comments"
        ).checked
    ){
        code =
            removeComments(code);
    }

    if(
        document.getElementById(
            "locals"
        ).checked
    ){
        code =
            renameLocals(code);
    }

    if(
        document.getElementById(
            "strings"
        ).checked
    ){
        code =
            protectStrings(code);
    }

    if(
        document.getElementById(
            "minify"
        ).checked
    ){
        code =
            minify(code);
    }

    if(level >= 3){

        code =
            "local " +
            randomName() +
            "=function(...)return ... end;" +
            code;
    }

    if(level >= 4){

        code =
            "local " +
            randomName() +
            "=true;" +
            code;
    }

    output.value = code;

    document.getElementById(
        "outputCount"
    ).textContent =
        code.length.toLocaleString()
        + " chars";

    return code;
}

/* Copy */

async function copyObfuscated(){

    const code =
        obfuscate();

    if(!code)
        return;

    try{

        await navigator.clipboard.writeText(
            code
        );

        toast(
            "คัดลอกโค้ดที่ย่อ + Obfuscate แล้ว"
        );

    }catch{

        output.select();

        document.execCommand("copy");

        toast("คัดลอกแล้ว");
    }
}

/* Generate URL */

async function generateURL(){

    const code =
        obfuscate();

    if(!code)
        return;

    const name =
        prompt(
            "ชื่อ Script:",
            "My Lua Script"
        );

    if(name === null)
        return;

    try{

        const response =
            await fetch(
                "/api/scripts",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        name,
                        code
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "สร้าง URL ไม่สำเร็จ"
            );
        }

        document.getElementById(
            "generatedURL"
        ).value =
            data.url;

        document.getElementById(
            "urlBox"
        ).style.display =
            "block";

        toast(
            "สร้าง URL สำเร็จ"
        );

    }catch(error){

        toast(error.message);
    }
}

/* Copy URL */

async function copyURL(){

    const url =
        document.getElementById(
            "generatedURL"
        ).value;

    if(!url)
        return;

    await navigator.clipboard.writeText(url);

    toast(
        "คัดลอก URL แล้ว"
    );
}

/* Download */

function downloadLua(){

    const code =
        output.value ||
        obfuscate();

    if(!code)
        return;

    const blob =
        new Blob(
            [code],
            {
                type:"text/plain"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "obfuscated.lua";

    a.click();

    URL.revokeObjectURL(url);

    toast(
        "ดาวน์โหลดแล้ว"
    );
}

/* Clear */

function clearAll(){

    input.value = "";
    output.value = "";

    document.getElementById(
        "inputCount"
    ).textContent =
        "0 chars";

    document.getElementById(
        "outputCount"
    ).textContent =
        "0 chars";

    document.getElementById(
        "urlBox"
    ).style.display =
        "none";

    toast(
        "ล้าง Editor แล้ว"
    );
}

/* Vault */

async function loadVault(){

    const list =
        document.getElementById(
            "scriptList"
        );

    try{

        const response =
            await fetch(
                "/api/scripts"
            );

        const scripts =
            await response.json();

        const search =
            document.getElementById(
                "search"
            ).value
            .toLowerCase()
            .trim();

        const filtered =
            scripts.filter(
                x =>
                    x.name
                    .toLowerCase()
                    .includes(search)
            );

        if(!filtered.length){

            list.innerHTML =
                `<div class="empty">
                    ยังไม่มี Script
                </div>`;

            return;
        }

        list.innerHTML =
            filtered.map(
                item => {

                    const name =
                        escapeHTML(
                            item.name
                        );

                    const date =
                        new Date(
                            item.createdAt
                        ).toLocaleString(
                            "th-TH"
                        );

                    return `
                    <div class="script">

                        <div class="script-name">
                            ${name}
                        </div>

                        <div class="meta">
                            ${date}
                            ·
                            ${Number(
                                item.size
                            ).toLocaleString()}
                            bytes
                        </div>

                        <div class="script-actions">

                            <button
                                onclick="copySaved('${encodeURIComponent(item.url)}')"
                            >
                                Copy
                            </button>

                            <button
                                onclick="window.open('${encodeURIComponent(item.url)}','_blank')"
                            >
                                Open
                            </button>

                            <button
                                onclick="deleteScript('${encodeURIComponent(item.id)}')"
                            >
                                Delete
                            </button>

                        </div>

                    </div>
                    `;
                }
            ).join("");

    }catch{

        list.innerHTML =
            `<div class="empty">
                ไม่สามารถโหลด Vault ได้
            </div>`;
    }
}

/* Copy saved */

async function copySaved(encoded){

    const url =
        decodeURIComponent(encoded);

    await navigator.clipboard.writeText(url);

    toast(
        "คัดลอก URL แล้ว"
    );
}

/* Delete */

async function deleteScript(encoded){

    const id =
        decodeURIComponent(encoded);

    if(
        !confirm(
            "ต้องการลบ Script นี้หรือไม่?"
        )
    ){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/scripts/" +
                encodeURIComponent(id),
                {
                    method:"DELETE"
                }
            );

        if(!response.ok)
            throw new Error();

        loadVault();

        toast(
            "ลบ Script แล้ว"
        );

    }catch{

        toast(
            "ลบไม่สำเร็จ"
        );
    }
}

/* Escape */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
