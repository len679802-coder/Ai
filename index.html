<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>RedLua Vault</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(255, 30, 30, .15),
            transparent 32%
        ),
        #070707;
    color: #eee;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 235px;
    padding: 22px;
    background: #0c0c0c;
    border-right: 1px solid #292929;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 21px;
    font-weight: 900;
    margin-bottom: 35px;
}

.logoBox {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    margin-right: 9px;
    border-radius: 11px;
    background:
        linear-gradient(
            135deg,
            #ff4141,
            #800000
        );
}

.logo span {
    color: #ff3636;
}

.sectionTitle {
    color: #555;
    font-size: 10px;
    letter-spacing: 1.5px;
    margin: 18px 8px 8px;
}

.nav {
    width: 100%;
    padding: 12px;
    margin-bottom: 5px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #777;
    text-align: left;
    cursor: pointer;
}

.nav:hover,
.nav.active {
    background: #251010;
    color: #fff;
}

.nav.active {
    box-shadow: inset 3px 0 #ff3030;
}

.server {
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 20px;
    padding: 11px;
    border: 1px solid #292929;
    border-radius: 10px;
    background: #111;
    color: #777;
    font-size: 10px;
}

.server b {
    color: #36dc8b;
}

.main {
    margin-left: 235px;
    padding: 30px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.title {
    font-size: 30px;
    font-weight: 900;
}

.title span {
    color: #ff3030;
}

.subtitle {
    margin-top: 4px;
    color: #666;
    font-size: 12px;
}

.header {
    margin-bottom: 22px;
}

.editors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card {
    overflow: hidden;
    background: #101010;
    border: 1px solid #292929;
    border-radius: 14px;
}

.cardHeader {
    display: flex;
    justify-content: space-between;
    padding: 13px 15px;
    border-bottom: 1px solid #292929;
    font-size: 11px;
    font-weight: 700;
}

.counter {
    color: #555;
}

textarea {
    display: block;
    width: 100%;
    height: 400px;
    padding: 17px;
    resize: none;
    outline: none;
    border: 0;
    background: #080808;
    color: #ddd;
    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;
    font-size: 13px;
    line-height: 1.65;
}

textarea::placeholder {
    color: #3b3b3b;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 15px;
}

.option {
    padding: 15px;
    background: #101010;
    border: 1px solid #292929;
    border-radius: 13px;
}

.optionTitle {
    margin-bottom: 10px;
    color: #aaa;
    font-size: 11px;
    font-weight: 700;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.btn {
    padding: 11px 15px;
    border: 1px solid #303030;
    border-radius: 9px;
    background: #171717;
    color: #ccc;
    cursor: pointer;
    font-size: 11px;
}

.btn:hover {
    border-color: #555;
}

.btn.red {
    border-color: #ff3030;
    background:
        linear-gradient(
            135deg,
            #ff3838,
            #8f0000
        );
    color: #fff;
}

.result {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #150909;
    border: 1px solid #482222;
    border-radius: 13px;
}

.resultTitle {
    margin-bottom: 8px;
    color: #ff5050;
    font-size: 11px;
    font-weight: 700;
}

.resultRow {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

.resultInput {
    flex: 1;
    min-width: 0;
    padding: 10px;
    outline: none;
    border: 1px solid #382020;
    border-radius: 8px;
    background: #080808;
    color: #fff;
    font-size: 11px;
}

.vaultTop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.search {
    width: 230px;
    padding: 10px;
    outline: none;
    border: 1px solid #292929;
    border-radius: 9px;
    background: #111;
    color: #fff;
}

.list {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap: 13px;
}

.script {
    padding: 15px;
    background: #111;
    border: 1px solid #292929;
    border-radius: 13px;
}

.scriptName {
    margin-bottom: 7px;
    font-weight: 700;
    word-break: break-word;
}

.meta {
    margin-bottom: 12px;
    color: #555;
    font-size: 10px;
}

.scriptButtons {
    display: flex;
    gap: 6px;
}

.scriptButtons button {
    flex: 1;
    padding: 8px;
    border: 1px solid #292929;
    border-radius: 7px;
    background: #181818;
    color: #aaa;
    cursor: pointer;
    font-size: 10px;
}

.empty {
    grid-column: 1 / -1;
    padding: 50px;
    border: 1px dashed #333;
    border-radius: 13px;
    color: #444;
    text-align: center;
}

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    padding: 12px 15px;
    border-left: 3px solid #ff3030;
    border-radius: 9px;
    background: #181818;
    color: #fff;
    font-size: 11px;
    opacity: 0;
    transform: translateY(50px);
    transition: .25s;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.mobile {
    display: none;
}

@media (max-width: 900px) {

    .sidebar {
        z-index: 50;
        transform: translateX(-100%);
        transition: .25s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        margin-left: 0;
        padding: 15px;
    }

    .mobile {
        display: block;
        margin-bottom: 15px;
    }

    .mobile button {
        padding: 10px 13px;
        border: 1px solid #292929;
        border-radius: 8px;
        background: #111;
        color: #fff;
    }

    .editors,
    .options {
        grid-template-columns: 1fr;
    }

    .list {
        grid-template-columns: 1fr;
    }

    textarea {
        height: 320px;
    }

    .resultRow {
        flex-direction: column;
    }

    .vaultTop {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
    }

    .search {
        width: 100%;
    }
}

</style>

</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="logoBox">L</div>
        Red<span>Lua</span>
    </div>

    <div class="sectionTitle">
        WORKSPACE
    </div>

    <button
        class="nav active"
        id="editorNav"
        onclick="showPage('editor')"
    >
        Lua Script
    </button>

    <button
        class="nav"
        id="vaultNav"
        onclick="showPage('vault')"
    >
        Script Vault
    </button>

    <div class="sectionTitle">
        SERVER
    </div>

    <button
        class="nav"
        onclick="checkServer()"
    >
        Server Status
    </button>

    <div class="server">
        ● <b>SERVER ONLINE</b>
        <br>
        RedLua Vault
    </div>

</aside>

<main class="main">

    <div class="mobile">
        <button onclick="toggleMenu()">
            Menu
        </button>
    </div>

    <section
        class="page active"
        id="editorPage"
    >

        <div class="header">

            <div class="title">
                Lua <span>Vault</span>
            </div>

            <div class="subtitle">
                เก็บ Script และสร้าง URL สำหรับเรียกใช้งาน
            </div>

        </div>

        <div class="editors">

            <div class="card">

                <div class="cardHeader">

                    <span>
                        LUA SOURCE
                    </span>

                    <span
                        class="counter"
                        id="inputCounter"
                    >
                        0 chars
                    </span>

                </div>

                <textarea
                    id="input"
                    spellcheck="false"
                    placeholder="วาง Lua Script ที่นี่..."
                ></textarea>

            </div>

            <div class="card">

                <div class="cardHeader">

                    <span>
                        LOADER
                    </span>

                    <span
                        class="counter"
                    >
                        GENERATED
                    </span>

                </div>

                <textarea
                    id="loader"
                    readonly
                    spellcheck="false"
                    placeholder="กด Generate URL แล้ว Loader จะปรากฏที่นี่..."
                ></textarea>

            </div>

        </div>

        <div class="buttons">

            <button
                class="btn red"
                onclick="createScript()"
            >
                Generate URL
            </button>

            <button
                class="btn red"
                onclick="copyLoader()"
            >
                Copy Loader
            </button>

            <button
                class="btn"
                onclick="copyURL()"
            >
                Copy URL
            </button>

            <button
                class="btn"
                onclick="downloadLua()"
            >
                Download Lua
            </button>

            <button
                class="btn"
                onclick="clearEditor()"
            >
                Clear
            </button>

        </div>

        <div
            class="result"
            id="result"
        >

            <div class="resultTitle">
                SCRIPT URL
            </div>

            <div class="resultRow">

                <input
                    class="resultInput"
                    id="scriptURL"
                    readonly
                >

                <button
                    class="btn red"
                    onclick="copyURL()"
                >
                    Copy
                </button>

            </div>

            <div class="resultTitle">
                LOADER
            </div>

            <div class="resultRow">

                <input
                    class="resultInput"
                    id="loaderInput"
                    readonly
                >

                <button
                    class="btn red"
                    onclick="copyLoader()"
                >
                    Copy Loader
                </button>

            </div>

        </div>

    </section>

    <section
        class="page"
        id="vaultPage"
    >

        <div class="header">

            <div class="title">
                Script <span>Vault</span>
            </div>

            <div class="subtitle">
                Scripts ที่บันทึกไว้
            </div>

        </div>

        <div class="vaultTop">

            <strong>
                Saved Scripts
            </strong>

            <input
                class="search"
                id="search"
                placeholder="ค้นหา..."
                oninput="loadVault()"
            >

        </div>

        <div
            class="list"
            id="scriptList"
        ></div>

    </section>

</main>

<div
    class="toast"
    id="toast"
></div>

<script>

let currentURL = "";
let currentLoader = "";

const input =
    document.getElementById("input");

input.addEventListener(
    "input",
    () => {

        document.getElementById(
            "inputCounter"
        ).textContent =
            input.value.length.toLocaleString()
            + " chars";

    }
);

function toast(message) {

    const element =
        document.getElementById("toast");

    element.textContent = message;

    element.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {
            element.classList.remove("show");
        }, 2200);
}

function toggleMenu() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");
}

function showPage(page) {

    const editor =
        document.getElementById("editorPage");

    const vault =
        document.getElementById("vaultPage");

    const editorNav =
        document.getElementById("editorNav");

    const vaultNav =
        document.getElementById("vaultNav");

    if (page === "editor") {

        editor.classList.add("active");
        vault.classList.remove("active");

        editorNav.classList.add("active");
        vaultNav.classList.remove("active");

    } else {

        editor.classList.remove("active");
        vault.classList.add("active");

        editorNav.classList.remove("active");
        vaultNav.classList.add("active");

        loadVault();
    }

    document
        .getElementById("sidebar")
        .classList.remove("open");
}

async function createScript() {

    const code =
        input.value.trim();

    if (!code) {

        toast(
            "กรุณาวาง Lua Script ก่อน"
        );

        return;
    }

    const name =
        prompt(
            "ตั้งชื่อ Script",
            "My Script"
        );

    if (name === null) {
        return;
    }

    try {

        toast("กำลังสร้าง URL...");

        const response =
            await fetch(
                "/api/scripts",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        code
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "สร้างไม่สำเร็จ"
            );
        }

        currentURL = data.url;
        currentLoader = data.loader;

        document.getElementById(
            "scriptURL"
        ).value =
            currentURL;

        document.getElementById(
            "loaderInput"
        ).value =
            currentLoader;

        document.getElementById(
            "loader"
        ).value =
            currentLoader;

        document.getElementById(
            "result"
        ).style.display =
            "block";

        toast(
            "สร้าง URL สำเร็จ"
        );

    } catch (error) {

        toast(error.message);
    }
}

async function copyLoader() {

    if (!currentLoader) {

        toast(
            "กด Generate URL ก่อน"
        );

        return;
    }

    try {

        await navigator.clipboard.writeText(
            currentLoader
        );

        toast(
            "คัดลอก Loader แล้ว"
        );

    } catch {

        const input =
            document.getElementById(
                "loaderInput"
            );

        input.select();

        document.execCommand("copy");

        toast(
            "คัดลอก Loader แล้ว"
        );
    }
}

async function copyURL() {

    if (!currentURL) {

        toast(
            "ยังไม่มี URL"
        );

        return;
    }

    await navigator.clipboard.writeText(
        currentURL
    );

    toast(
        "คัดลอก URL แล้ว"
    );
}

function downloadLua() {

    const code =
        input.value;

    if (!code.trim()) {

        toast(
            "ไม่มี Lua ให้ดาวน์โหลด"
        );

        return;
    }

    const blob =
        new Blob(
            [code],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = "script.lua";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);
}

function clearEditor() {

    input.value = "";

    document.getElementById(
        "loader"
    ).value = "";

    document.getElementById(
        "inputCounter"
    ).textContent =
        "0 chars";

    document.getElementById(
        "result"
    ).style.display =
        "none";

    currentURL = "";
    currentLoader = "";

    toast(
        "ล้างแล้ว"
    );
}

async function loadVault() {

    const list =
        document.getElementById(
            "scriptList"
        );

    try {

        const response =
            await fetch(
                "/api/scripts"
            );

        const scripts =
            await response.json();

        const search =
            document.getElementById(
                "search"
            ).value
            .toLowerCase()
            .trim();

        const filtered =
            scripts.filter(
                item =>
                    item.name
                        .toLowerCase()
                        .includes(search)
            );

        if (!filtered.length) {

            list.innerHTML =
                `<div class="empty">
                    ยังไม่มี Script
                </div>`;

            return;
        }

        list.innerHTML =
            filtered.map(item => {

                const date =
                    new Date(
                        item.createdAt
                    ).toLocaleString(
                        "th-TH"
                    );

                return `
                    <div class="script">

                        <div class="scriptName">
                            ${escapeHTML(item.name)}
                        </div>

                        <div class="meta">
                            ${date}
                            ·
                            ${Number(
                                item.size
                            ).toLocaleString()}
                            bytes
                        </div>

                        <div class="scriptButtons">

                            <button
                                onclick="useScript('${item.url}')"
                            >
                                Loader
                            </button>

                            <button
                                onclick="copySavedURL('${item.url}')"
                            >
                                Copy URL
                            </button>

                            <button
                                onclick="deleteScript('${item.id}')"
                            >
                                Delete
                            </button>

                        </div>

                    </div>
                `;

            }).join("");

    } catch {

        list.innerHTML =
            `<div class="empty">
                โหลด Vault ไม่สำเร็จ
            </div>`;
    }
}

function useScript(url) {

    currentURL = url;

    currentLoader =
        `loadstring(game:HttpGet("${url}"))()`;

    document.getElementById(
        "scriptURL"
    ).value = currentURL;

    document.getElementById(
        "loaderInput"
    ).value = currentLoader;

    document.getElementById(
        "loader"
    ).value = currentLoader;

    document.getElementById(
        "result"
    ).style.display =
        "block";

    showPage("editor");

    toast(
        "โหลด Loader แล้ว"
    );
}

async function copySavedURL(url) {

    await navigator.clipboard.writeText(
        url
    );

    toast(
        "คัดลอก URL แล้ว"
    );
}

async function deleteScript(id) {

    if (
        !confirm(
            "ต้องการลบ Script นี้หรือไม่?"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/scripts/" +
                encodeURIComponent(id),
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {
            throw new Error();
        }

        loadVault();

        toast(
            "ลบ Script แล้ว"
        );

    } catch {

        toast(
            "ลบ Script ไม่สำเร็จ"
        );
    }
}

async function checkServer() {

    try {

        const response =
            await fetch(
                "/api/status"
            );

        const data =
            await response.json();

        toast(
            `Server Online • ${data.scripts} Scripts`
        );

    } catch {

        toast(
            "Server Offline"
        );
    }
}

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
